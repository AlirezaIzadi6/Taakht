# Loaded automatically next to compose.yaml on a laptop: publishes Postgres and
# Kafka on the loopback address only, so a service can run from the IDE against them.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  kafka:
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    ports:
      - "127.0.0.1:9094:9094"
