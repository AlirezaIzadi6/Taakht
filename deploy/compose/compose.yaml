# The shared base: Postgres, Kafka, the auth mock and the Envoy gateway. Only the
# gateway publishes a port; everything else stays on the internal network.
# On a laptop, compose.override.yaml is loaded as well and publishes the ports a
# developer needs; on the shared server run with `-f compose.yaml` only
# (docs/guidelines/deployment.md).
# A project name of its own, so it cannot clash with the containers and volumes of the MVP prototype.
name: taakht-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taakht}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taakht}
      # The service roles are created by the init script. The defaults are for development;
      # on the shared server set real values in a .env file (see .env.example).
      AD_DB_PASSWORD: ${AD_DB_PASSWORD:-ad}
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD:-matching}
      DEAL_DB_PASSWORD: ${DEAL_DB_PASSWORD:-deal}
      REPUTATION_DB_PASSWORD: ${REPUTATION_DB_PASSWORD:-reputation}
      COMMUNICATION_DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:-communication}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # One database per service (ADR 0013), created on the first start of an empty volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while the init scripts run, a temporary server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by kafka-init, never by a client by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The heap is capped by hand (docs/guidelines/deployment.md).
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
      # The image writes to /tmp by default, which is not the volume below.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: no reason to wait for more consumers before the first rebalance.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topics before any service starts: on a fresh Kafka a consumer of a
  # missing topic stays not ready (docs/guidelines/deployment.md).
  # One topic per publishing service, named <service>.events (docs/guidelines/kafka-events.md).
  # Services depend on this one with condition: service_completed_successfully.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in ad.events matching.events deal.events reputation.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # Mock AuthProvider: login issues RS256 tokens for the seeded users. It sits on the
  # internal network only; Envoy exposes POST /v1/auth/login at the edge (#59).
  auth:
    build:
      context: ../..
      dockerfile: src/mocks/auth/Dockerfile
    restart: unless-stopped
    environment:
      GRPC_ADDR: ":9204"
      HTTP_ADDR: ":8204"
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_KEY_ID: dev-1
      JWT_ISSUER: taakht-auth-mock
      JWT_AUDIENCE: taakht-api
    volumes:
      - ../../.dev-keys:/keys:ro

  # Envoy edge: REST/JSON to gRPC, JWT validation and claim forwarding. It is the
  # only published port; the auth mock and the future services stay internal (#59).
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ../../.dev-keys/jwks.json:/keys/jwks.json:ro

volumes:
  postgres-data:
  kafka-data:
