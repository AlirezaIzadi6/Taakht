syntax = "proto3";

package taakht.hello.v1;

import "google/api/annotations.proto";

option go_package = "spike/backend/gen/taakht/hello/v1;hellov1";

service HelloService {
  rpc GetGreeting(GetGreetingRequest) returns (GetGreetingResponse) {
    option (google.api.http) = {get: "/v1/greetings/{name}"};
  }
}

message GetGreetingRequest {
  string name = 1;
}
message GetGreetingResponse {
  string message = 1;
}
