name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decide which parts of the monorepo changed so unrelated stacks are skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      go: ${{ steps.filter.outputs.go }}
      dotnet-solutions: ${{ steps.solutions.outputs.list }}
      go-modules: ${{ steps.modules.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.sln'
              - '**/*.slnx'
              - 'global.json'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'

      # Every solution file (one per .NET service) becomes one matrix entry.
      - id: solutions
        run: |
          list=$(find . \( -name '*.sln' -o -name '*.slnx' \) -not -path '*/node_modules/*' -not -path './spikes/*' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # Every directory holding a go.mod becomes one matrix entry.
      - id: modules
        run: |
          list=$(find . -name go.mod -not -path '*/node_modules/*' -not -path './spikes/*' -exec dirname {} \; | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      # Check out the PR's own head commit. The default is GitHub's synthetic merge
      # commit, which would make every PR look like it contains a merge commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # PRs are merged with "Rebase and merge", so every commit lands on main as written:
      # each message must follow Conventional Commits and there must be no merge commits.
      - name: Check commit messages and history shape
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|perf|build|ci)(\([a-z0-9-]+\))?!?: .+'
          range="origin/${BASE_REF}..HEAD"
          status=0
          if [ -n "$(git rev-list --merges "$range")" ]; then
            echo "This branch contains merge commits. Rebase onto ${BASE_REF} instead of merging it."
            status=1
          fi
          for sha in $(git rev-list --no-merges "$range"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -qE "$pattern"; then
              echo "Not a Conventional Commit: $sha $subject"
              status=1
            fi
          done
          exit $status

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' && needs.changes.outputs.dotnet-solutions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJson(needs.changes.outputs.dotnet-solutions) }}
    env:
      SOLUTION: ${{ matrix.solution }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore "$SOLUTION"

      - name: Format check
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build (analyzers + warnings as errors)
        run: dotnet build "$SOLUTION" -c Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" -c Release --no-build

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.go-modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.go-modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest # pin to a specific v2.x once the team settles on one
          working-directory: ${{ matrix.module }}
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # Single required status check for branch protection: skipped jobs count as OK, failed/cancelled ones don't.
  ci-ok:
    if: always()
    needs: [commit-messages, dotnet, go]
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed"; exit 1
          fi
